# CI del frontend: revisa estilo (ESLint + Prettier), construye la imagen de
# nginx y comprueba que sirva la app y el panel admin.
#
# El despliegue lo hace Railway directamente desde este repositorio (rama main,
# railway.json en la raíz). Este workflow no despliega: solo valida.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Lint, formato, build y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formato (Prettier)
        run: npm run format:check

      - name: Construir la imagen (nginx)
        run: docker build -t banklite-frontend .

      - name: Probar la imagen
        run: |
          docker run -d --name frontend -p 8080:80 banklite-frontend
          for i in $(seq 1 20); do curl -fs http://localhost:8080/ > /dev/null && break; sleep 1; done
          for ruta in / /login.html /dashboard.html /api.js /styles.css /admin/ /robots.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$ruta")
            echo "$ruta -> $code"
            [ "$code" = 200 ] || exit 1
          done
          # Archivos de configuración que no deben quedar publicados
          for ruta in /Dockerfile /nginx.conf /package.json /eslint.config.mjs; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$ruta")
            echo "$ruta -> $code"
            [ "$code" = 404 ] || exit 1
          done
          curl -fsI http://localhost:8080/ | grep -i "content-security-policy"
