# Encabezados de seguridad comunes. nginx.conf los incluye en cada location que sirve
# contenido. Se copia a /etc/nginx/banklite-seguridad.conf, fuera de conf.d/ (nginx carga
# todo conf.d/ en el contexto http). Usa $csp, definida en el server de nginx.conf.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy $csp always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
