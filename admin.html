<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>BankLite Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F5F9; --surface:#fff; --border:#E7E9F1; --text:#1B1D29; --muted:#6B7280; --faint:#9AA1B2;
    --brand-1:#FF7A45; --brand-2:#E5372B; --brand:#F0552F; --grad:linear-gradient(135deg,var(--brand-1),var(--brand-2));
    --side:#16171F; --side-text:#C9CCD6; --side-hover:#22242F;
    --good:#16A34A; --good-bg:#EAF8EE; --warn:#B45309; --warn-bg:#FFF4E5; --bad:#C2262B; --bad-bg:#FDEDED; --info:#3653D9; --info-bg:#ECF0FF;
    --r-l:16px; --r-m:12px; --r-s:9px; --shadow:0 1px 2px rgba(20,20,40,.04),0 8px 24px rgba(20,20,40,.06);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:14px}
  h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em}
  p{margin:0}
  button,input,select,textarea{font-family:inherit;font-size:inherit}
  .mono{font-family:'IBM Plex Mono',monospace;font-size:.92em}
  .hidden{display:none!important}
  .muted{color:var(--muted)}
  :focus-visible{outline:2px solid var(--info);outline-offset:2px}

  input,select,textarea{width:100%;background:#fff;color:var(--text);border:1px solid var(--border);padding:10px 12px;border-radius:var(--r-s)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(240,85,47,.12)}
  label{display:block;font-size:.78rem;font-weight:700;color:var(--muted);margin:12px 0 5px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:var(--r-s);padding:9px 14px;font-weight:700;cursor:pointer;white-space:nowrap;background:#fff;color:var(--text);border-color:var(--border)}
  .btn:hover{border-color:#cfd3df}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .btn-primary{background:var(--grad);color:#fff;border-color:transparent}
  .btn-primary:hover{filter:brightness(1.05)}
  .btn-danger{background:var(--bad);color:#fff;border-color:transparent}
  .btn-sm{padding:6px 10px;font-size:.8rem}
  .btn-block{width:100%}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:.72rem;font-weight:800;white-space:nowrap}
  .b-good{background:var(--good-bg);color:var(--good)} .b-warn{background:var(--warn-bg);color:var(--warn)}
  .b-bad{background:var(--bad-bg);color:var(--bad)} .b-info{background:var(--info-bg);color:var(--info)}
  .b-gray{background:#EEF0F5;color:#555B6E} .b-dark{background:#2A2C38;color:#fff}

  /* Login */
  #loginView{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(900px 600px at 10% -10%,rgba(255,122,69,.18),transparent 60%),radial-gradient(800px 600px at 110% 110%,rgba(229,55,43,.12),transparent 60%),var(--bg)}
  .login-card{width:min(400px,100%);background:#fff;border-radius:var(--r-l);box-shadow:var(--shadow);overflow:hidden}
  .login-head{background:var(--grad);color:#fff;padding:26px 28px}
  .login-head .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem}
  .logo-chip{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-weight:800}
  .login-head p{margin-top:14px;opacity:.92;font-size:.88rem}
  .login-body{padding:22px 28px 28px}

  /* Shell */
  .shell{display:flex;min-height:100vh}
  .side{width:232px;flex:none;background:var(--side);color:var(--side-text);display:flex;flex-direction:column;padding:20px 12px;position:sticky;top:0;height:100vh}
  .side .brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;padding:0 8px 4px}
  .side .brand .logo-chip{background:var(--grad)}
  .side .brand small{display:block;font-size:.66rem;font-weight:600;color:var(--side-text);opacity:.8}
  .nav{display:flex;flex-direction:column;gap:2px;margin-top:22px}
  .nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--side-text);text-decoration:none;font-weight:700;font-size:.88rem}
  .nav a:hover{background:var(--side-hover);color:#fff}
  .nav a.active{background:rgba(240,85,47,.16);color:#fff}
  .nav a.active svg{color:var(--brand-1)}
  .nav svg{width:18px;height:18px;flex:none}
  .side .me{margin-top:auto;padding:12px;border-top:1px solid #2A2C38}
  .side .me strong{color:#fff;display:block}
  .main{flex:1;min-width:0;padding:26px 30px 60px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  .topbar h1{font-size:1.4rem}
  .topbar p{color:var(--muted);margin-top:3px}
  .mobile-bar{display:none}

  .card{background:#fff;border:1px solid var(--border);border-radius:var(--r-l);padding:18px}
  .card h3{font-size:.95rem;margin-bottom:12px}
  .grid{display:grid;gap:14px}
  .g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat .label{font-size:.76rem;font-weight:700;color:var(--muted)}
  .stat .value{font-size:1.6rem;font-weight:800;margin-top:6px}
  .stat .sub{font-size:.76rem;color:var(--muted);margin-top:4px}

  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:flex-end}
  .filters > *{flex:1 1 160px}
  .filters .grow{flex:3 1 260px}
  .filters .btn{flex:0 0 auto}

  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-m);background:#fff}
  table{width:100%;border-collapse:collapse;font-size:.85rem}
  th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:800;padding:10px 12px;border-bottom:1px solid var(--border);background:#FAFBFD;white-space:nowrap}
  td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr.clickable{cursor:pointer}
  tr.clickable:hover td{background:#FFF8F5}
  .amount{font-family:'IBM Plex Mono',monospace;font-weight:600;white-space:nowrap;text-align:right}
  .empty{padding:28px;text-align:center;color:var(--muted)}
  .pager{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:10px;color:var(--muted);font-size:.82rem}

  .kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:.86rem;margin:0}
  .kv dt{color:var(--muted);font-weight:700}
  .kv dd{margin:0;word-break:break-word}
  .section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}
  .section-title h3{font-size:.98rem;margin:0}
  .actions{display:flex;gap:8px;flex-wrap:wrap}

  /* Drawer y modal */
  .overlay{position:fixed;inset:0;background:rgba(15,16,24,.45);z-index:80;display:flex;justify-content:flex-end}
  .drawer{width:min(720px,100%);height:100%;background:var(--bg);overflow-y:auto;box-shadow:-10px 0 30px rgba(0,0,0,.15);animation:slideIn .2s ease-out}
  .drawer-head{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid var(--border);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .drawer-body{padding:18px 20px 40px}
  @keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
  .modal-overlay{position:fixed;inset:0;background:rgba(15,16,24,.5);z-index:120;display:grid;place-items:center;padding:16px}
  .modal{width:min(460px,100%);background:#fff;border-radius:var(--r-l);box-shadow:var(--shadow);padding:22px}
  .modal h3{font-size:1.05rem}
  .modal p.desc{color:var(--muted);margin-top:6px;font-size:.87rem}
  .modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  .alert{margin-top:12px;padding:10px 12px;border-radius:var(--r-s);font-size:.84rem;border:1px solid}
  .alert-error{background:var(--bad-bg);border-color:#F6C6C6;color:var(--bad)}
  .x-btn{background:none;border:none;font-size:1.4rem;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}

  .toast-stack{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px}
  .toast{background:#fff;border:1px solid var(--border);border-left:4px solid var(--good);border-radius:var(--r-s);padding:11px 14px;box-shadow:var(--shadow);font-size:.85rem;max-width:360px;animation:fadeIn .2s}
  .toast.err{border-left-color:var(--bad)}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .spin{width:16px;height:16px;border-radius:50%;border:2px solid #ddd;border-top-color:var(--brand);animation:sp .7s linear infinite;display:inline-block;vertical-align:middle}
  @keyframes sp{to{transform:rotate(360deg)}}
  .loading{padding:26px;text-align:center;color:var(--muted)}
  pre.json{background:#16171F;color:#E6E8EF;border-radius:var(--r-s);padding:12px;font-size:.75rem;overflow:auto;max-height:260px;margin:8px 0 0}

  @media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:860px){
    .side{position:fixed;left:0;top:0;z-index:90;transform:translateX(-100%);transition:transform .2s}
    .side.open{transform:none;box-shadow:10px 0 30px rgba(0,0,0,.3)}
    .main{padding:16px 16px 50px}
    .mobile-bar{display:flex;align-items:center;justify-content:space-between;margin:-4px 0 14px}
    .g3,.g2{grid-template-columns:minmax(0,1fr)}
    .kv{grid-template-columns:1fr}
    .kv dt{margin-top:6px}
  }
  @media (max-width:520px){.g4{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<main id="loginView" class="hidden">
  <div class="login-card">
    <div class="login-head">
      <div class="logo"><span class="logo-chip">B</span> BankLite Admin</div>
      <p>Panel interno para empleados del banco. Todas las acciones quedan registradas.</p>
    </div>
    <form class="login-body" id="loginForm" autocomplete="on">
      <label for="lgUser">Usuario</label>
      <input id="lgUser" name="username" autocomplete="username" required maxlength="40" />
      <label for="lgPass">Contraseña</label>
      <input id="lgPass" name="password" type="password" autocomplete="current-password" required maxlength="200" />
      <div id="loginError" class="alert alert-error hidden"></div>
      <button class="btn btn-primary btn-block" style="margin-top:18px" id="loginBtn" type="submit">Ingresar</button>
    </form>
  </div>
</main>

<!-- ============ APP ============ -->
<div id="appView" class="shell hidden">
  <aside class="side" id="side">
    <div class="brand"><span class="logo-chip">B</span><div>BankLite<small>Panel administrativo</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="me">
      <strong id="meName">—</strong>
      <span class="muted" id="meRole" style="font-size:.78rem"></span>
      <button class="btn btn-sm btn-block" style="margin-top:10px;background:transparent;color:var(--side-text);border-color:#33364A" id="logoutBtn">Cerrar sesión</button>
    </div>
  </aside>
  <section class="main">
    <div class="mobile-bar">
      <button class="btn btn-sm" id="menuBtn" aria-label="Abrir menú">☰ Menú</button>
      <strong>BankLite Admin</strong>
    </div>
    <div id="page"></div>
  </section>
</div>

<div class="toast-stack" id="toasts"></div>
<div id="drawerRoot"></div>
<div id="modalRoot"></div>

<script>
// Dominio del API Gateway: Railway fuera de localhost; docker-compose en local.
if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
  window.BANKLITE_CONFIG = { apiGateway: 'https://api-gateway-production-dd7f.up.railway.app' };
}
</script>
<script>
(function () {
  'use strict';
  const GW = ((window.BANKLITE_CONFIG || {}).apiGateway || 'http://localhost:8080').replace(/\/+$/, '');
  const TOKEN_KEY = 'banklite.staff.token';
  const state = { token: null, staff: null };

  /* ---------------- utilidades ---------------- */
  const $ = (id) => document.getElementById(id);
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = (n, cur) => new Intl.NumberFormat('es-CO', { style: 'currency', currency: cur || 'COP', maximumFractionDigits: 2 }).format(Number(n) || 0);
  const date = (d) => d ? new Date(d).toLocaleString('es-CO', { timeZone: 'America/Bogota', dateStyle: 'medium', timeStyle: 'short' }) : '—';
  const short = (id) => id ? esc(String(id).slice(0, 8)) + '…' : '—';
  const isAdmin = () => state.staff?.role === 'admin';
  const store = {
    get() { try { return sessionStorage.getItem(TOKEN_KEY); } catch { return null; } },
    set(v) { try { v ? sessionStorage.setItem(TOKEN_KEY, v) : sessionStorage.removeItem(TOKEN_KEY); } catch {} },
  };

  function toast(msg, isError) {
    const el = document.createElement('div');
    el.className = 'toast' + (isError ? ' err' : '');
    el.textContent = msg;
    $('toasts').appendChild(el);
    setTimeout(() => el.remove(), isError ? 6000 : 3500);
  }

  async function api(method, path, body) {
    let res;
    try {
      res = await fetch(GW + path, {
        method,
        headers: { ...(body ? { 'Content-Type': 'application/json' } : {}), ...(state.token ? { Authorization: 'Bearer ' + state.token } : {}) },
        body: body ? JSON.stringify(body) : undefined,
      });
    } catch {
      throw new Error('No se pudo conectar con el servidor. Revisa tu conexión.');
    }
    let data = null;
    try { data = await res.json(); } catch {}
    if (res.status === 401 && state.token && path !== '/auth/admin/login') {
      logout('Tu sesión expiró. Vuelve a ingresar.');
      throw new Error('Sesión expirada');
    }
    if (!res.ok) {
      const msg = Array.isArray(data?.message) ? data.message.join(' ') : (data?.message || `Error ${res.status}`);
      const err = new Error(msg); err.status = res.status; throw err;
    }
    return data;
  }
  /** Igual que api() pero devuelve null en vez de lanzar (para paneles que toleran un servicio caído). */
  const tryApi = (m, p, b) => api(m, p, b).catch(() => null);
  const qs = (o) => { const p = new URLSearchParams(); for (const [k, v] of Object.entries(o)) if (v !== undefined && v !== null && v !== '') p.set(k, v); const s = p.toString(); return s ? '?' + s : ''; };

  /* ---------------- etiquetas ---------------- */
  const ACCESS = { active: ['Activo', 'b-good'], locked: ['Bloqueo temporal', 'b-warn'], disabled: ['Suspendido', 'b-bad'] };
  const ACC_STATUS = { pending: ['Pendiente', 'b-gray'], active: ['Activa', 'b-good'], blocked: ['Bloqueada', 'b-bad'], closed: ['Cerrada', 'b-dark'] };
  const KYC = { verified: ['Verificado', 'b-good'], rejected: ['Rechazado', 'b-bad'] };
  const TX = { transfer: 'Transferencia', credit: 'Abono', deposit: 'Consignación', debit: 'Cargo', reversal: 'Reverso', payment: 'Pago a comercio' };
  const NOTIF = { pending: ['Pendiente', 'b-warn'], sent: ['Enviada', 'b-good'], failed: ['Fallida', 'b-bad'] };
  const CHANNEL = { in_app: 'App', email: 'Correo', whatsapp: 'WhatsApp' };
  const ROLE = { admin: 'Administrador', support: 'Soporte' };
  const badge = (map, key, extra) => { const [t, c] = map[key] || [key || '—', 'b-gray']; return `<span class="badge ${c}">${esc(t)}${extra ? ' · ' + esc(extra) : ''}</span>`; };

  /* ---------------- modal y drawer ---------------- */
  function closeModal() { $('modalRoot').innerHTML = ''; }
  /**
   * Modal de formulario. fields: [{name,label,type,value,options,min,step,placeholder,required}].
   * onSubmit(values) puede lanzar: el error se muestra dentro del modal.
   */
  function formModal({ title, desc, fields = [], confirm = 'Confirmar', danger = false, onSubmit }) {
    const inputs = fields.map((f) => {
      const id = 'mf_' + f.name;
      let ctl;
      if (f.type === 'select') ctl = `<select id="${id}">${f.options.map(([v, t]) => `<option value="${esc(v)}" ${v === f.value ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
      else if (f.type === 'textarea') ctl = `<textarea id="${id}" rows="3" maxlength="300" placeholder="${esc(f.placeholder || '')}">${esc(f.value || '')}</textarea>`;
      else ctl = `<input id="${id}" type="${f.type || 'text'}" value="${esc(f.value ?? '')}" placeholder="${esc(f.placeholder || '')}" ${f.min !== undefined ? `min="${f.min}"` : ''} ${f.step ? `step="${f.step}"` : ''} autocomplete="off" />`;
      return `<label for="${id}">${esc(f.label)}</label>${ctl}`;
    }).join('');
    $('modalRoot').innerHTML = `<div class="modal-overlay"><form class="modal" id="mForm">
      <h3>${esc(title)}</h3>${desc ? `<p class="desc">${desc}</p>` : ''}${inputs}
      <div id="mErr" class="alert alert-error hidden"></div>
      <div class="foot"><button type="button" class="btn" id="mCancel">Cancelar</button><button type="submit" class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="mOk">${esc(confirm)}</button></div>
    </form></div>`;
    $('mCancel').onclick = closeModal;
    $('modalRoot').querySelector('.modal-overlay').addEventListener('mousedown', (e) => { if (e.target.classList.contains('modal-overlay')) closeModal(); });
    const first = fields[0] && $('mf_' + fields[0].name); if (first) first.focus();
    $('mForm').onsubmit = async (e) => {
      e.preventDefault();
      const values = Object.fromEntries(fields.map((f) => [f.name, $('mf_' + f.name).value.trim()]));
      for (const f of fields) if (f.required && !values[f.name]) { showErr(`Completa: ${f.label}`); return; }
      $('mOk').disabled = true; $('mOk').innerHTML = '<span class="spin"></span>';
      try { await onSubmit(values); closeModal(); }
      catch (err) { showErr(err.message); $('mOk').disabled = false; $('mOk').textContent = confirm; }
    };
    function showErr(m) { const el = $('mErr'); el.textContent = m; el.classList.remove('hidden'); }
  }
  const reasonField = { name: 'reason', label: 'Motivo (queda en la auditoría)', type: 'textarea', required: true, placeholder: 'Ej.: Solicitud del cliente por llamada, caso #123' };

  function openDrawer(title, render) {
    $('drawerRoot').innerHTML = `<div class="overlay" id="ov"><div class="drawer"><div class="drawer-head"><h2 style="font-size:1.1rem">${esc(title)}</h2><button class="x-btn" id="dClose" aria-label="Cerrar">×</button></div><div class="drawer-body" id="dBody"><div class="loading"><span class="spin"></span></div></div></div></div>`;
    $('dClose').onclick = closeDrawer;
    $('ov').addEventListener('mousedown', (e) => { if (e.target.id === 'ov') closeDrawer(); });
    render($('dBody'));
  }
  function closeDrawer() { $('drawerRoot').innerHTML = ''; }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if ($('modalRoot').innerHTML) closeModal(); else closeDrawer(); } });

  /* ---------------- navegación ---------------- */
  const ICONS = {
    dashboard: '<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',
    customers: '<circle cx="9" cy="8" r="4"/><path d="M1 21c0-4 4-6 8-6s8 2 8 6"/><path d="M17 3a4 4 0 010 8M23 21c0-3-2-5-5-5.6"/>',
    accounts: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
    movements: '<path d="M7 7h13M17 3l4 4-4 4M17 17H4M7 21l-4-4 4-4"/>',
    monitoring: '<path d="M3 12h4l3 8 4-16 3 8h4"/>',
    staff: '<path d="M12 2l8 4v6c0 5-3.5 9-8 10-4.5-1-8-5-8-10V6z"/>',
    audit: '<path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 13l2 2 4-4"/>',
  };
  const PAGES = [
    { id: 'dashboard', title: 'Tablero', render: renderDashboard },
    { id: 'customers', title: 'Clientes', render: renderCustomers },
    { id: 'accounts', title: 'Cuentas', render: renderAccounts },
    { id: 'movements', title: 'Movimientos', render: renderMovements },
    { id: 'monitoring', title: 'Monitoreo', render: renderMonitoring },
    { id: 'staff', title: 'Empleados', render: renderStaff, adminOnly: true },
    { id: 'audit', title: 'Auditoría', render: renderAudit },
  ];

  function buildNav() {
    $('nav').innerHTML = PAGES.filter((p) => !p.adminOnly || isAdmin()).map((p) =>
      `<a href="#/${p.id}" data-page="${p.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[p.id]}</svg>${esc(p.title)}</a>`).join('');
  }
  function route() {
    const id = (location.hash.match(/^#\/([\w-]+)/) || [])[1] || 'dashboard';
    const page = PAGES.find((p) => p.id === id && (!p.adminOnly || isAdmin())) || PAGES[0];
    document.querySelectorAll('#nav a').forEach((a) => a.classList.toggle('active', a.dataset.page === page.id));
    $('side').classList.remove('open');
    closeDrawer();
    $('page').innerHTML = '<div class="loading"><span class="spin"></span></div>';
    page.render($('page'));
  }
  window.addEventListener('hashchange', () => { if (state.token) route(); });
  $('menuBtn').onclick = () => $('side').classList.toggle('open');

  const header = (title, sub, actions = '') => `<div class="topbar"><div><h1>${esc(title)}</h1>${sub ? `<p>${esc(sub)}</p>` : ''}</div><div class="actions">${actions}</div></div>`;
  const pager = (data, onPage) => {
    const pages = Math.max(1, Math.ceil(data.total / data.limit));
    const id = 'pg' + Math.random().toString(36).slice(2, 8);
    setTimeout(() => {
      const prev = $(id + 'p'), next = $(id + 'n');
      if (prev) prev.onclick = () => onPage(data.page - 1);
      if (next) next.onclick = () => onPage(data.page + 1);
    });
    return `<div class="pager"><span>${data.total} resultado(s) · página ${data.page} de ${pages}</span>
      <button class="btn btn-sm" id="${id}p" ${data.page <= 1 ? 'disabled' : ''}>Anterior</button>
      <button class="btn btn-sm" id="${id}n" ${data.page >= pages ? 'disabled' : ''}>Siguiente</button></div>`;
  };
  const errorBox = (err) => `<div class="card"><p style="color:var(--bad);font-weight:700">No se pudo cargar</p><p class="muted" style="margin-top:6px">${esc(err.message)}</p></div>`;

  /* ================= TABLERO ================= */
  async function renderDashboard(el) {
    const [health, ledger, notif, recon, authOb, kycOb, accDlq, notDlq] = await Promise.all([
      fetch(GW + '/health').then((r) => r.json()).catch(() => null),
      tryApi('GET', '/ledger/admin/summary'),
      tryApi('GET', '/notifications/admin/summary'),
      tryApi('GET', '/ledger/admin/reconciliation'),
      tryApi('GET', '/auth/admin/outbox'),
      tryApi('GET', '/kyc/admin/outbox'),
      tryApi('GET', '/accounts/admin/dlq'),
      tryApi('GET', '/notifications/admin/dlq'),
    ]);
    const up = health?.services?.filter((s) => s.status === 'ok').length ?? 0;
    const total = health?.services?.length ?? 7;
    const txCount = (ledger?.byType || []).reduce((a, r) => a + r.count, 0);
    const volume = (ledger?.byType || []).filter((r) => r.type !== 'reversal' && r.currency === 'COP').reduce((a, r) => a + r.amount, 0);
    const pendingEvents = (authOb?.pending || 0) + (kycOb?.pending || 0) + (recon?.pendingEvents?.count || 0);
    const dead = (accDlq?.deadLetters || 0) + (notDlq?.deadLetters || 0);
    const failedNotif = (notif?.byChannelAndStatus || []).filter((r) => r.status === 'failed').reduce((a, r) => a + r.count, 0);

    el.innerHTML = header('Tablero', `Hola, ${state.staff.nombre}. Resumen en tiempo real.`, '<button class="btn btn-sm" id="refresh">Actualizar</button>') + `
      <div class="grid g4">
        <div class="card stat"><div class="label">Microservicios en línea</div><div class="value" style="color:${up === total ? 'var(--good)' : 'var(--bad)'}">${up}/${total}</div><div class="sub">${health ? (health.status === 'ok' ? 'Todo operativo' : 'Hay servicios degradados') : 'Gateway sin respuesta'}</div></div>
        <div class="card stat"><div class="label">Transacciones (24 h)</div><div class="value">${txCount}</div><div class="sub">${money(volume)} en COP</div></div>
        <div class="card stat"><div class="label">Eventos por publicar</div><div class="value" style="color:${pendingEvents ? 'var(--warn)' : 'inherit'}">${pendingEvents}</div><div class="sub">Outbox de auth, kyc y ledger</div></div>
        <div class="card stat"><div class="label">Mensajes en DLQ</div><div class="value" style="color:${dead ? 'var(--bad)' : 'inherit'}">${dead}</div><div class="sub">${failedNotif} correo(s) fallido(s) en 7 días</div></div>
      </div>
      <div class="grid g2" style="margin-top:14px">
        <div class="card"><h3>Estado de los servicios</h3>${health ? `<div class="table-wrap"><table><thead><tr><th>Servicio</th><th>Estado</th><th style="text-align:right">Latencia</th></tr></thead><tbody>${health.services.map((s) => `<tr><td>${esc(s.name)}</td><td>${s.status === 'ok' ? '<span class="badge b-good">En línea</span>' : '<span class="badge b-bad">Caído</span>'}</td><td class="amount">${s.latencyMs} ms</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">El API Gateway no responde.</p>'}</div>
        <div class="card"><h3>Cuadre contable del ledger</h3>${recon ? `
          <p style="font-size:1.05rem;font-weight:800;color:${recon.ok ? 'var(--good)' : 'var(--bad)'}">${recon.ok ? '✓ Saldos y asientos cuadran' : '✗ Hay descuadres'}</p>
          <dl class="kv" style="margin-top:12px"><dt>Saldos descuadrados</dt><dd>${recon.balanceMismatches.length}</dd><dt>Asientos huérfanos</dt><dd>${recon.orphanEntries.length}</dd><dt>Transacciones desbalanceadas</dt><dd>${recon.unbalancedTransactions.length}</dd><dt>Revisado</dt><dd>${date(recon.checkedAt)}</dd></dl>` : '<p class="muted">Ledger no disponible.</p>'}
          <h3 style="margin-top:18px">Movimientos de las últimas 24 h</h3>${ledger?.byType?.length ? `<div class="table-wrap"><table><thead><tr><th>Tipo</th><th>Cantidad</th><th style="text-align:right">Monto</th></tr></thead><tbody>${ledger.byType.map((r) => `<tr><td>${esc(TX[r.type] || r.type)}</td><td>${r.count}</td><td class="amount">${money(r.amount, r.currency)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">Sin movimientos.</p>'}
        </div>
      </div>`;
    $('refresh').onclick = () => route();
  }

  /* ================= CLIENTES ================= */
  async function renderCustomers(el, params = {}) {
    const q = params.q ?? '';
    const access = params.access ?? '';
    const page = params.page ?? 1;
    el.innerHTML = header('Clientes', 'Busca por nombre, documento, correo, teléfono o ID de usuario.') + `
      <form class="filters" id="cf"><div class="grow"><label>Buscar</label><input id="cq" value="${esc(q)}" placeholder="Ej.: Laura Gómez, 1020304050, laura@correo.com" /></div>
      <div><label>Acceso</label><select id="ca"><option value="">Todos</option><option value="active" ${access === 'active' ? 'selected' : ''}>Activo</option><option value="locked" ${access === 'locked' ? 'selected' : ''}>Bloqueo temporal</option><option value="disabled" ${access === 'disabled' ? 'selected' : ''}>Suspendido</option></select></div>
      <button class="btn btn-primary" type="submit">Buscar</button></form><div id="cres"><div class="loading"><span class="spin"></span></div></div>`;
    $('cf').onsubmit = (e) => { e.preventDefault(); renderCustomers(el, { q: $('cq').value.trim(), access: $('ca').value, page: 1 }); };

    try {
      // Credenciales (auth) y expedientes (kyc) viven en servicios distintos: se combinan por idUser.
      const [auth, kyc] = await Promise.all([
        api('GET', '/auth/admin/customers' + qs({ q, status: access, page, limit: 25 })),
        q ? tryApi('GET', '/kyc/admin/records' + qs({ q, limit: 25 })) : Promise.resolve(null),
      ]);
      const rows = new Map(auth.items.map((c) => [c.idUser, { auth: c }]));
      if (kyc && !access) for (const k of kyc.items) rows.set(k.idUser, { ...(rows.get(k.idUser) || {}), kyc: k });
      // Completa el nombre de los que solo llegaron por auth.
      await Promise.all([...rows.entries()].filter(([, r]) => !r.kyc).map(async ([id, r]) => { r.kyc = await tryApi('GET', `/kyc/admin/records/${id}`); }));

      const list = [...rows.entries()];
      $('cres').innerHTML = list.length ? `<div class="table-wrap"><table><thead><tr><th>Cliente</th><th>Documento</th><th>Correo</th><th>Acceso</th><th>Identidad</th><th>Registro</th></tr></thead><tbody>
        ${list.map(([id, r]) => `<tr class="clickable" data-id="${esc(id)}"><td><strong>${esc(r.kyc ? `${r.kyc.nombres} ${r.kyc.apellidos}` : 'Sin datos de identidad')}</strong><div class="muted mono">${short(id)}</div></td>
          <td class="mono">${esc(r.kyc ? `${r.kyc.tipoDocumento} ${r.kyc.numeroDocumento}` : '—')}</td><td>${esc(r.auth?.email || r.kyc?.email || '—')}</td>
          <td>${r.auth ? badge(ACCESS, r.auth.access) : '<span class="badge b-gray">Sin credenciales</span>'}</td><td>${r.kyc ? badge(KYC, r.kyc.status) : '<span class="badge b-gray">Sin KYC</span>'}</td>
          <td>${date(r.auth?.createdAt || r.kyc?.createdAt)}</td></tr>`).join('')}
        </tbody></table></div>${pager(auth, (p) => renderCustomers(el, { q, access, page: p }))}` : '<div class="card empty">No se encontraron clientes.</div>';
      $('cres').querySelectorAll('tr[data-id]').forEach((tr) => tr.onclick = () => openCustomer(tr.dataset.id));
    } catch (err) { $('cres').innerHTML = errorBox(err); }
  }

      const [auth, kyc, accounts, cards, notifs] = await Promise.all([
        tryApi('GET', `/auth/admin/customers/${idUser}`),
        tryApi('GET', `/kyc/admin/records/${idUser}`),
        tryApi('GET', '/accounts/admin/accounts' + qs({ q: idUser, limit: 50 })),
        tryApi('GET', '/cards/admin/cards' + qs({ userId: idUser, limit: 50 })),
        tryApi('GET', '/notifications/admin/notifications' + qs({ idUser, limit: 10 })),
      ]);

        <div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start">
          <div><h2 style="font-size:1.2rem">${esc(name)}</h2><p class="muted mono" style="margin-top:4px">${esc(idUser)}</p></div>
          <div class="actions">${auth ? badge(ACCESS, auth.access) : ''} ${kyc ? badge(KYC, kyc.status) : '<span class="badge b-gray">Sin KYC</span>'}</div></div>
          ${auth?.access === 'disabled' ? `<div class="alert alert-error">Acceso suspendido el ${date(auth.disabledAt)}. Motivo: ${esc(auth.disabledReason)}</div>` : ''}
          ${auth?.access === 'locked' ? `<div class="alert" style="background:var(--warn-bg);border-color:#FFDBAF;color:var(--warn)">Bloqueo temporal por intentos fallidos hasta ${date(auth.lockedUntil)}.</div>` : ''}
          ${isAdmin() && auth ? `<div class="actions" style="margin-top:14px">${auth.access === 'active' ? '<button class="btn btn-sm btn-danger" id="cDisable">Suspender acceso</button>' : '<button class="btn btn-sm btn-primary" id="cEnable">Reactivar acceso</button>'}</div>` : ''}
        </div>
        <div class="section-title"><h3>Identidad (KYC)</h3></div>
        <div class="card">${kyc ? `<dl class="kv"><dt>Documento</dt><dd class="mono">${esc(kyc.tipoDocumento)} ${esc(kyc.numeroDocumento)}</dd><dt>Nacimiento</dt><dd>${esc(kyc.fechaNacimiento)}</dd><dt>Expedición</dt><dd>${esc(kyc.fechaExpedicion)}</dd><dt>Correo</dt><dd>${esc(kyc.email || '—')}</dd><dt>Teléfono</dt><dd>${esc(kyc.telefono || '—')}</dd><dt>Verificado el</dt><dd>${date(kyc.updatedAt)}</dd></dl>` : '<p class="muted">El cliente no tiene verificación de identidad.</p>'}</div>
        <div class="section-title"><h3>Acceso a la app</h3></div>
        <div class="card">${auth ? `<dl class="kv"><dt>Correo de acceso</dt><dd>${esc(auth.email)}</dd><dt>Sesiones activas</dt><dd>${auth.activeSessions}</dd><dt>Último ingreso</dt><dd>${date(auth.lastLoginAt)}</dd><dt>Intentos fallidos</dt><dd>${auth.failedLoginAttempts}</dd><dt>Cliente desde</dt><dd>${date(auth.createdAt)}</dd></dl>` : '<p class="muted">Todavía no creó usuario y contraseña.</p>'}</div>
        <div class="section-title"><h3>Cuentas</h3></div>
        ${accounts?.items?.length ? `<div class="table-wrap"><table><thead><tr><th>Número</th><th>Tipo</th><th>Estado</th><th>Apertura</th></tr></thead><tbody>${accounts.items.map((a) => `<tr class="clickable" data-acc="${esc(a.id)}"><td class="mono">${esc(a.accountNumber || '—')}</td><td>${a.accountType === 'savings' ? 'Ahorros' : 'Corriente'} · ${esc(a.currency)}</td><td>${badge(ACC_STATUS, a.status, a.status === 'blocked' ? (a.blockedBy === 'bank' ? 'banco' : 'titular') : '')}</td><td>${date(a.createdAt)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="card empty">Sin cuentas.</div>'}
        <div class="section-title"><h3>Tarjetas</h3></div>
        ${cards?.items?.length ? `<div class="table-wrap"><table><thead><tr><th>Tarjeta</th><th>Cuenta</th><th>Vence</th><th>Estado</th></tr></thead><tbody>${cards.items.map((c) => `<tr><td class="mono">•••• ${esc(c.lastFour)}</td><td class="mono">${esc(c.accountNumber)}</td><td class="mono">${esc(c.expiry)}</td><td>${c.status === 'active' ? '<span class="badge b-good">Activa</span>' : '<span class="badge b-info">Congelada</span>'}</td></tr>`).join('')}</tbody></table></div>` : '<div class="card empty">Sin tarjetas.</div>'}
        <div class="section-title"><h3>Últimas notificaciones</h3></div>
        ${notifs?.items?.length ? `<div class="table-wrap"><table><thead><tr><th>Evento</th><th>Canal</th><th>Estado</th><th>Fecha</th></tr></thead><tbody>${notifs.items.map((n) => `<tr><td>${esc(n.title)}<div class="muted mono">${esc(n.event)}</div></td><td>${esc(CHANNEL[n.channel] || n.channel)}</td><td>${badge(NOTIF, n.status)}</td><td>${date(n.createdAt)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="card empty">Sin notificaciones.</div>'}`;
      body.querySelectorAll('tr[data-acc]').forEach((tr) => tr.onclick = () => openAccount(tr.dataset.acc));
      const reopen = () => openCustomer(idUser);
      if ($('cDisable')) $('cDisable').onclick = () => formModal({
        title: 'Suspender acceso del cliente', danger: true, confirm: 'Suspender',
        desc: 'El cliente no podrá iniciar sesión y se cerrarán todas sus sesiones abiertas. Sus cuentas y su dinero no cambian.',
        fields: [reasonField],
        onSubmit: async (v) => { await api('POST', `/auth/admin/customers/${idUser}/disable`, { reason: v.reason }); toast('Acceso suspendido.'); reopen(); },
      });
      if ($('cEnable')) $('cEnable').onclick = () => formModal({
        title: 'Reactivar acceso del cliente', confirm: 'Reactivar',
        desc: 'El cliente podrá volver a iniciar sesión. También se levanta el bloqueo temporal por intentos fallidos.',

  /* ================= CUENTAS ================= */

        ${data.items.map((a) => `<tr class="clickable" data-id="${esc(a.id)}"><td class="mono"><strong>${esc(a.accountNumber || '—')}</strong></td><td class="mono">${short(a.idUser)}</td><td>${a.accountType === 'savings' ? 'Ahorros' : 'Corriente'} · ${esc(a.currency)}</td><td>${badge(ACC_STATUS, a.status, a.status === 'blocked' ? (a.blockedBy === 'bank' ? 'banco' : 'titular') : '')}</td><td class="amount">${money(a.dailyLimit, a.currency)}</td><td>${date(a.createdAt)}</td></tr>`).join('')}

  function openAccount(id) {
    openDrawer('Detalle de la cuenta', async (body) => {
      let acc;
      try { acc = await api('GET', `/accounts/admin/accounts/${id}`); } catch (err) { body.innerHTML = errorBox(err); return; }
      const [bal, txs, kyc] = await Promise.all([
        tryApi('GET', `/ledger/admin/accounts/${id}/balance`),
        tryApi('GET', '/ledger/admin/transactions' + qs({ accountId: id, limit: 15 })),
        tryApi('GET', `/kyc/admin/records/${acc.idUser}`),
      ]);
      const canEdit = isAdmin() && acc.status !== 'closed';
      body.innerHTML = `
        <div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
          <div><p class="muted" style="font-weight:700;font-size:.78rem">${acc.accountType === 'savings' ? 'CUENTA DE AHORROS' : 'CUENTA CORRIENTE'} · ${esc(acc.currency)}</p><h2 class="mono" style="font-size:1.35rem;margin-top:4px">${esc(acc.accountNumber || 'Sin número')}</h2></div>
          <div style="text-align:right"><p class="muted" style="font-size:.78rem;font-weight:700">SALDO</p><p class="mono" style="font-size:1.4rem;font-weight:700">${bal ? money(bal.balance, acc.currency) : '—'}</p></div></div>
          <div class="actions" style="margin-top:10px">${badge(ACC_STATUS, acc.status, acc.status === 'blocked' ? (acc.blockedBy === 'bank' ? 'por el banco' : 'por el titular') : '')}</div>
          ${canEdit ? `<div class="actions" style="margin-top:14px">
            ${acc.status === 'active' ? '<button class="btn btn-sm btn-danger" id="aBlock">Bloquear</button>' : ''}
            ${acc.status === 'blocked' ? '<button class="btn btn-sm btn-primary" id="aUnblock">Desbloquear</button>' : ''}
            ${acc.status !== 'pending' ? '<button class="btn btn-sm" id="aLimits">Cambiar límites</button>' : ''}
            <button class="btn btn-sm" id="aClose" style="color:var(--bad)">Cerrar cuenta</button></div>` : ''}
        </div>
        <div class="section-title"><h3>Datos</h3></div>
        <div class="card"><dl class="kv"><dt>Titular</dt><dd>${kyc ? `<a href="#" id="aOwner">${esc(kyc.nombres)} ${esc(kyc.apellidos)}</a>` : `<span class="mono">${esc(acc.idUser)}</span>`}</dd>
          <dt>Límite diario</dt><dd class="mono">${money(acc.dailyLimit, acc.currency)}</dd><dt>Límite mensual</dt><dd class="mono">${money(acc.monthlyLimit, acc.currency)}</dd>
          <dt>Apertura</dt><dd>${date(acc.createdAt)}</dd><dt>Última modificación</dt><dd>${date(acc.updatedAt)}</dd><dt>ID</dt><dd class="mono">${esc(acc.id)}</dd></dl></div>
        <div class="section-title"><h3>Últimos movimientos</h3><a href="#/movements" id="aAllTx" class="btn btn-sm">Ver todos</a></div>
        ${txTable(txs?.items || [], id)}`;
      bindTxRows(body);
      if ($('aOwner')) $('aOwner').onclick = (e) => { e.preventDefault(); openCustomer(acc.idUser); };
      $('aAllTx').onclick = (e) => { e.preventDefault(); closeDrawer(); location.hash = '#/movements'; setTimeout(() => renderMovements($('page'), { accountId: id }), 0); };
      const reopen = () => openAccount(id);
      const setStatus = (status, title, desc, danger) => formModal({ title, desc, danger, confirm: 'Confirmar', fields: [reasonField],
        onSubmit: async (v) => { await api('PATCH', `/accounts/admin/accounts/${id}/status`, { status, reason: v.reason }); toast('Estado actualizado.'); reopen(); } });
      if ($('aBlock')) $('aBlock').onclick = () => setStatus('blocked', 'Bloquear cuenta', 'La cuenta no podrá enviar ni recibir dinero. El titular no podrá desbloquearla desde la app.', true);
      if ($('aUnblock')) $('aUnblock').onclick = () => setStatus('active', 'Desbloquear cuenta', 'La cuenta vuelve a operar con normalidad.');
      if ($('aClose')) $('aClose').onclick = () => setStatus('closed', 'Cerrar cuenta', '<strong>Es definitivo:</strong> una cuenta cerrada no se puede reabrir ni modificar.', true);

          { name: 'monthlyLimit', label: `Límite mensual (${acc.currency})`, type: 'number', value: acc.monthlyLimit, min: 0, step: '0.01', required: true },
          reasonField,
        ],
        onSubmit: async (v) => { await api('PATCH', `/accounts/admin/accounts/${id}/limits`, { dailyLimit: Number(v.dailyLimit), monthlyLimit: Number(v.monthlyLimit), reason: v.reason }); toast('Límites actualizados.'); reopen(); } });
    });
  }

  /* ================= MOVIMIENTOS ================= */
  function txTable(items, perspective) {
    if (!items.length) return '<div class="card empty">Sin movimientos.</div>';
    return `<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Origen → Destino</th><th>Descripción</th><th style="text-align:right">Monto</th><th></th></tr></thead><tbody>
      ${items.map((t) => {
        const sign = perspective ? (t.destinationAccountId === perspective ? '+' : '−') : '';
        return `<tr class="clickable" data-tx="${esc(t.id)}"><td>${date(t.createdAt)}</td><td>${esc(TX[t.type] || t.type)}</td>
          <td class="mono">${esc(t.sourceAccountNumber || 'Sistema')} → ${esc(t.destinationAccountNumber || short(t.destinationAccountId))}</td>
          <td>${esc(t.description)}</td><td class="amount" style="color:${sign === '+' ? 'var(--good)' : 'inherit'}">${sign}${money(t.amount, t.currency)}</td>
          <td>${t.reversed ? '<span class="badge b-info">Reversada</span>' : ''}</td></tr>`;
      }).join('')}</tbody></table></div>`;
  }
  const bindTxRows = (root) => root.querySelectorAll('tr[data-tx]').forEach((tr) => tr.onclick = () => openTransaction(tr.dataset.tx));

  async function renderMovements(el, params = {}) {
    const p = { accountId: '', type: '', from: '', to: '', page: 1, ...params };
    el.innerHTML = header('Movimientos', 'Todas las transacciones del ledger (doble partida).') + `
      <form class="filters" id="mf"><div class="grow"><label>ID de cuenta</label><input id="mAcc" value="${esc(p.accountId)}" placeholder="Opcional: filtra por una cuenta" /></div>
      <div><label>Tipo</label><select id="mType"><option value="">Todos</option>${Object.entries(TX).map(([k, t]) => `<option value="${k}" ${p.type === k ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      <div><label>Desde</label><input type="date" id="mFrom" value="${esc(p.from)}" /></div><div><label>Hasta</label><input type="date" id="mTo" value="${esc(p.to)}" /></div>
      <button class="btn btn-primary" type="submit">Filtrar</button></form><div id="mres"><div class="loading"><span class="spin"></span></div></div>`;
    $('mf').onsubmit = (e) => { e.preventDefault(); renderMovements(el, { accountId: $('mAcc').value.trim(), type: $('mType').value, from: $('mFrom').value, to: $('mTo').value, page: 1 }); };
    try {
      // "Hasta" incluye todo ese día.
      const to = p.to ? new Date(new Date(p.to + 'T00:00:00-05:00').getTime() + 86400_000).toISOString() : '';
      const from = p.from ? new Date(p.from + 'T00:00:00-05:00').toISOString() : '';
      const data = await api('GET', '/ledger/admin/transactions' + qs({ accountId: p.accountId, type: p.type, from, to, page: p.page, limit: 25 }));
      $('mres').innerHTML = txTable(data.items, p.accountId || null) + (data.items.length ? pager(data, (pg) => renderMovements(el, { ...p, page: pg })) : '');
      bindTxRows($('mres'));
    } catch (err) { $('mres').innerHTML = errorBox(err); }
  }

  function openTransaction(id) {
    openDrawer('Detalle de la transacción', async (body) => {
      let t;
      try { t = await api('GET', `/ledger/admin/transactions/${id}`); } catch (err) { body.innerHTML = errorBox(err); return; }
      const canReverse = isAdmin() && t.type !== 'reversal' && !t.reversal && t.sourceAccountId;
      body.innerHTML = `
        <div class="card"><p class="muted" style="font-weight:700;font-size:.78rem">${esc((TX[t.type] || t.type).toUpperCase())}</p>
          <p class="mono" style="font-size:1.6rem;font-weight:700;margin-top:4px">${money(t.amount, t.currency)}</p><p style="margin-top:6px">${esc(t.description)}</p>
          ${t.reversal ? `<div class="alert" style="background:var(--info-bg);border-color:#C9D3FF;color:var(--info)">Reversada el ${date(t.reversal.createdAt)}: ${esc(t.reversal.description)}</div>` : ''}
          ${t.reversedTransactionId ? `<div class="alert" style="background:var(--info-bg);border-color:#C9D3FF;color:var(--info)">Este movimiento es el reverso de <a href="#" id="tOrig" class="mono">${short(t.reversedTransactionId)}</a></div>` : ''}
          ${canReverse ? '<div class="actions" style="margin-top:14px"><button class="btn btn-sm btn-danger" id="tRev">Reversar transacción</button></div>' : ''}</div>
        <div class="section-title"><h3>Datos</h3></div>
        <div class="card"><dl class="kv"><dt>Fecha</dt><dd>${date(t.createdAt)}</dd><dt>Cuenta origen</dt><dd class="mono">${esc(t.sourceAccountNumber || (t.sourceAccountId?.startsWith('00000000-0000-4000-8000-') ? 'Sistema' : t.sourceAccountId) || 'Sistema')}</dd><dt>Cuenta destino</dt><dd class="mono">${esc(t.destinationAccountNumber || t.destinationAccountId)}</dd><dt>Iniciada por</dt><dd class="mono">${esc(t.userId || 'Sistema')}</dd><dt>ID</dt><dd class="mono">${esc(t.id)}</dd><dt>Idempotencia</dt><dd class="mono">${esc(t.idempotencyKey)}</dd></dl></div>
        <div class="section-title"><h3>Asientos contables</h3></div>
        <div class="table-wrap"><table><thead><tr><th>Cuenta</th><th style="text-align:right">Débito / crédito</th></tr></thead><tbody>${t.entries.map((e) => `<tr><td class="mono">${esc(e.accountId)}</td><td class="amount" style="color:${e.amount >= 0 ? 'var(--good)' : 'var(--bad)'}">${e.amount >= 0 ? '+' : ''}${money(e.amount, e.currency)}</td></tr>`).join('')}
          <tr><td><strong>Total (debe ser 0)</strong></td><td class="amount"><strong>${money(t.entries.reduce((a, e) => a + e.amount, 0), t.currency)}</strong></td></tr></tbody></table></div>`;
      if ($('tOrig')) $('tOrig').onclick = (e) => { e.preventDefault(); openTransaction(t.reversedTransactionId); };
      if ($('tRev')) $('tRev').onclick = () => formModal({
        title: 'Reversar transacción', danger: true, confirm: 'Reversar',
        desc: `Se devolverán <strong>${esc(money(t.amount, t.currency))}</strong> a la cuenta de origen con asientos contrarios. Solo se puede hacer una vez, y falla si el destinatario ya no tiene ese saldo.`,
        fields: [{ ...reasonField, label: 'Motivo (máx. 120 caracteres, queda en la auditoría)' }],
        onSubmit: async (v) => { await api('POST', `/ledger/admin/transactions/${id}/reversal`, { reason: v.reason.slice(0, 120) }); toast('Transacción reversada.'); openTransaction(id); },
      });
    });
  }

  /* ================= MONITOREO ================= */
  async function renderMonitoring(el) {
    const [health, authOb, kycOb, recon, accDlq, notDlq, failed, pending] = await Promise.all([
      fetch(GW + '/health').then((r) => r.json()).catch(() => null),
      tryApi('GET', '/auth/admin/outbox'), tryApi('GET', '/kyc/admin/outbox'), tryApi('GET', '/ledger/admin/reconciliation'),
      tryApi('GET', '/accounts/admin/dlq'), tryApi('GET', '/notifications/admin/dlq'),
      tryApi('GET', '/notifications/admin/notifications' + qs({ status: 'failed', limit: 20 })),
      tryApi('GET', '/notifications/admin/notifications' + qs({ status: 'pending', channel: 'email', limit: 20 })),
    ]);
    const outboxRow = (name, ob) => ob ? `<tr><td>${name}</td><td>${ob.pending}</td><td>${ob.failing ?? '—'}</td><td>${date(ob.oldestPending)}</td><td>${ob.brokerConnected === false ? '<span class="badge b-bad">Sin RabbitMQ</span>' : '<span class="badge b-good">Conectado</span>'}</td></tr>` : `<tr><td>${name}</td><td colspan="4" class="muted">No disponible</td></tr>`;
    const dlqCard = (name, path, d) => `<div class="card"><h3>${esc(name)}</h3>${d?.connected ? `
      <dl class="kv"><dt>Cola</dt><dd class="mono">${esc(d.queue)}</dd><dt>Por procesar</dt><dd>${d.ready}</dd><dt>Consumidores</dt><dd>${d.consumers}</dd><dt>Esperando reintento</dt><dd>${d.waitingRetry}</dd><dt>En DLQ</dt><dd><strong style="color:${d.deadLetters ? 'var(--bad)' : 'inherit'}">${d.deadLetters}</strong></dd></dl>
      <div class="actions" style="margin-top:12px">${d.deadLetters ? `<button class="btn btn-sm" data-peek="${path}">Ver mensajes</button>${isAdmin() ? `<button class="btn btn-sm btn-primary" data-requeue="${path}">Reprocesar DLQ</button>` : ''}` : '<span class="muted">Sin mensajes muertos.</span>'}</div><div data-peekout="${path}"></div>`
      : '<p class="muted">El consumidor no está conectado a RabbitMQ.</p>'}</div>`;
    const notifRows = (list, retry) => list?.items?.length ? `<div class="table-wrap"><table><thead><tr><th>Notificación</th><th>Cliente</th><th>Intentos</th><th>Último error</th><th>Fecha</th><th></th></tr></thead><tbody>${list.items.map((n) => `<tr><td>${esc(n.title)}<div class="muted mono">${esc(n.event)}</div></td><td class="mono">${short(n.idUser)}</td><td>${n.deliveryAttempts ?? 0}</td><td>${esc(n.lastError || '—')}${n.nextAttemptAt ? `<div class="muted">Próximo: ${date(n.nextAttemptAt)}</div>` : ''}</td><td>${date(n.createdAt)}</td><td>${retry ? `<button class="btn btn-sm" data-retry="${esc(n.id)}">Reintentar</button>` : ''}</td></tr>`).join('')}</tbody></table></div>` : '<div class="card empty">Ninguna.</div>';

    el.innerHTML = header('Monitoreo', 'Salud técnica: servicios, eventos, colas y envíos.', '<button class="btn btn-sm" id="refresh">Actualizar</button>') + `
      <div class="card"><h3>Microservicios (vía API Gateway)</h3>${health ? `<div class="table-wrap"><table><thead><tr><th>Servicio</th><th>Estado</th><th style="text-align:right">Latencia</th></tr></thead><tbody>${health.services.map((s) => `<tr><td>${esc(s.name)}</td><td>${s.status === 'ok' ? '<span class="badge b-good">En línea</span>' : '<span class="badge b-bad">Caído</span>'}</td><td class="amount">${s.latencyMs} ms</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">El API Gateway no responde.</p>'}</div>
      <div class="section-title"><h3>Outbox (eventos guardados pendientes de publicar)</h3></div>
      <div class="table-wrap"><table><thead><tr><th>Servicio</th><th>Pendientes</th><th>Con fallos</th><th>Más antiguo</th><th>Broker</th></tr></thead><tbody>
        ${outboxRow('auth-service', authOb)}${outboxRow('kyc-service', kycOb)}${recon ? `<tr><td>ledger-service</td><td>${recon.pendingEvents.count}</td><td>—</td><td>${date(recon.pendingEvents.oldest)}</td><td>—</td></tr>` : '<tr><td>ledger-service</td><td colspan="4" class="muted">No disponible</td></tr>'}
      </tbody></table></div>
      <div class="section-title"><h3>Colas de eventos (reintentos y DLQ)</h3></div>
      <div class="grid g2">${dlqCard('account-service', 'accounts', accDlq)}${dlqCard('notification-service', 'notifications', notDlq)}</div>
      <div class="section-title"><h3>Correos fallidos</h3></div>${notifRows(failed, true)}
      <div class="section-title"><h3>Correos en reintento automático</h3></div>${notifRows(pending, true)}`;
    $('refresh').onclick = () => route();
    el.querySelectorAll('[data-peek]').forEach((b) => b.onclick = async () => {
      const out = el.querySelector(`[data-peekout="${b.dataset.peek}"]`);
      out.innerHTML = '<div class="loading"><span class="spin"></span></div>';
      try { const msgs = await api('GET', `/${b.dataset.peek}/admin/dlq/messages`); out.innerHTML = msgs.map((m) => `<p style="margin-top:10px"><strong>${esc(m.routingKey)}</strong> · ${esc(m.attempts)} intento(s) · <span style="color:var(--bad)">${esc(m.lastError || '')}</span></p><pre class="json">${esc(JSON.stringify(m.message, null, 2))}</pre>`).join('') || '<p class="muted">Vacía.</p>'; }
      catch (err) { out.innerHTML = `<p style="color:var(--bad)">${esc(err.message)}</p>`; }
    });
    el.querySelectorAll('[data-requeue]').forEach((b) => b.onclick = () => formModal({
      title: 'Reprocesar mensajes de la DLQ', confirm: 'Reprocesar',
      desc: 'Se devuelven a la cola principal (hasta 100) con el contador de intentos en cero. Hazlo después de corregir la causa del fallo.',
      onSubmit: async () => { const r = await api('POST', `/${b.dataset.requeue}/admin/dlq/requeue`); toast(`${r.moved} mensaje(s) devueltos a la cola.`); route(); },
    }));
    el.querySelectorAll('[data-retry]').forEach((b) => b.onclick = async () => {
      b.disabled = true; b.innerHTML = '<span class="spin"></span>';
      try { const r = await api('POST', `/notifications/admin/notifications/${b.dataset.retry}/retry`); toast(r.status === 'sent' ? 'Correo enviado.' : 'El envío volvió a fallar; quedó programado para reintento.', r.status !== 'sent'); route(); }
      catch (err) { toast(err.message, true); b.disabled = false; b.textContent = 'Reintentar'; }
    });
  }

  /* ================= EMPLEADOS ================= */
  async function renderStaff(el) {
    let list;
    try { list = await api('GET', '/auth/admin/staff'); } catch (err) { el.innerHTML = errorBox(err); return; }
    el.innerHTML = header('Empleados', 'Quién puede entrar al panel y con qué permisos.', '<button class="btn btn-primary btn-sm" id="sNew">+ Nuevo empleado</button>') + `
      <div class="card" style="margin-bottom:14px"><p class="muted"><strong>Soporte</strong>: consulta clientes, cuentas, movimientos y monitoreo, y reintenta correos. <strong>Administrador</strong>: además suspende clientes, bloquea o cierra cuentas, cambia límites, reversa transacciones, reprocesa la DLQ y gestiona empleados.</p></div>
      <div class="table-wrap"><table><thead><tr><th>Empleado</th><th>Rol</th><th>Estado</th><th>Último ingreso</th><th></th></tr></thead><tbody>
      ${list.map((s) => `<tr><td><strong>${esc(s.nombre)}</strong><div class="muted mono">${esc(s.username)}</div></td><td>${s.role === 'admin' ? '<span class="badge b-info">Administrador</span>' : '<span class="badge b-gray">Soporte</span>'}</td>
        <td>${s.active ? (s.locked ? '<span class="badge b-warn">Bloqueado 15 min</span>' : '<span class="badge b-good">Activo</span>') : '<span class="badge b-bad">Desactivado</span>'}</td><td>${date(s.lastLoginAt)}</td>
        <td><div class="actions">${s.id === state.staff.id ? '<span class="muted">Tú</span>' : `<button class="btn btn-sm" data-edit="${esc(s.id)}">Editar</button>`}</div></td></tr>`).join('')}
      </tbody></table></div>`;
    $('sNew').onclick = () => formModal({
      title: 'Nuevo empleado', confirm: 'Crear',
      desc: 'Comparte la contraseña inicial por un canal seguro; el empleado la puede cambiar pidiéndoselo a un administrador.',
      fields: [
        { name: 'nombre', label: 'Nombre completo', required: true },
        { name: 'username', label: 'Usuario (minúsculas, números, . _ -)', required: true, placeholder: 'ej.: laura.gomez' },
        { name: 'password', label: 'Contraseña inicial (12+ caracteres, mayúsculas, minúsculas y números)', type: 'password', required: true },
        { name: 'role', label: 'Rol', type: 'select', value: 'support', options: [['support', 'Soporte'], ['admin', 'Administrador']] },
      ],
      onSubmit: async (v) => { await api('POST', '/auth/admin/staff', v); toast('Empleado creado.'); route(); },
    });
    el.querySelectorAll('[data-edit]').forEach((b) => b.onclick = () => {
      const s = list.find((x) => x.id === b.dataset.edit);
      formModal({
        title: `Editar a ${s.nombre}`, confirm: 'Guardar',
        fields: [
          { name: 'role', label: 'Rol', type: 'select', value: s.role, options: [['support', 'Soporte'], ['admin', 'Administrador']] },
          { name: 'active', label: 'Estado', type: 'select', value: String(s.active), options: [['true', 'Activo'], ['false', 'Desactivado']] },
          { name: 'password', label: 'Nueva contraseña (opcional; también desbloquea)', type: 'password' },
        ],
        onSubmit: async (v) => {
          const body = { role: v.role, active: v.active === 'true' };
          if (v.password) body.password = v.password;
          await api('PATCH', `/auth/admin/staff/${s.id}`, body); toast('Empleado actualizado.'); route();
        },
      });
    });
  }

  /* ================= AUDITORÍA ================= */
  const ACTIONS = {
    'staff.login': 'Ingreso al panel', 'staff.create': 'Creó empleado', 'staff.update': 'Editó empleado',
    'customer.disable': 'Suspendió acceso', 'customer.enable': 'Reactivó acceso',
    'account.blocked': 'Bloqueó cuenta', 'account.active': 'Desbloqueó cuenta', 'account.closed': 'Cerró cuenta', 'account.limits': 'Cambió límites',
    'transaction.reverse': 'Reversó transacción', 'notification.retry': 'Reintentó correo', 'dlq.requeue': 'Reprocesó DLQ',
  };
  async function renderAudit(el, params = {}) {
    const hideLogins = params.hideLogins ?? true;
    const q = params.q ?? '';
    el.innerHTML = header('Auditoría', 'Cada acción de un empleado, registrada por el microservicio que la ejecutó.') + `
      <form class="filters" id="auf"><div class="grow"><label>ID afectado (cliente, cuenta, transacción…)</label><input id="auq" value="${esc(q)}" placeholder="Opcional" /></div>
      <div><label>Ingresos al panel</label><select id="aul"><option value="1" ${hideLogins ? 'selected' : ''}>Ocultar</option><option value="0" ${!hideLogins ? 'selected' : ''}>Mostrar</option></select></div>
      <button class="btn btn-primary" type="submit">Filtrar</button></form><div id="aures"><div class="loading"><span class="spin"></span></div></div>`;
    $('auf').onsubmit = (e) => { e.preventDefault(); renderAudit(el, { q: $('auq').value.trim(), hideLogins: $('aul').value === '1' }); };
    const sources = [['auth', '/auth/admin/audit'], ['account', '/accounts/admin/audit'], ['ledger', '/ledger/admin/audit'], ['notification', '/notifications/admin/audit']];
    const results = await Promise.all(sources.map(([svc, p]) => tryApi('GET', p + qs({ q, limit: 100 })).then((r) => (r?.items || []).map((i) => ({ ...i, svc })))));
    let items = results.flat().sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    if (hideLogins) items = items.filter((i) => i.action !== 'staff.login');
    $('aures').innerHTML = items.length ? `<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Empleado</th><th>Acción</th><th>Afectado</th><th>Motivo</th><th>Servicio</th></tr></thead><tbody>
      ${items.slice(0, 200).map((i) => `<tr><td>${date(i.createdAt)}</td><td><strong>${esc(i.staffUsername)}</strong></td><td>${esc(ACTIONS[i.action] || i.action)}${i.details ? `<div class="muted mono" style="font-size:.72rem">${esc(JSON.stringify(i.details)).slice(0, 140)}</div>` : ''}</td><td class="mono">${esc(i.targetType)} ${short(i.targetId)}</td><td>${esc(i.reason || '—')}</td><td><span class="badge b-gray">${esc(i.svc)}</span></td></tr>`).join('')}
      </tbody></table></div>` : '<div class="card empty">Sin registros.</div>';
  }

  /* ---------------- sesión ---------------- */
  function showLogin(message) {
    $('appView').classList.add('hidden');
    $('loginView').classList.remove('hidden');
    const e = $('loginError');
    if (message) { e.textContent = message; e.classList.remove('hidden'); } else e.classList.add('hidden');
    $('lgUser').focus();
  }
  function logout(message) {
    state.token = null; state.staff = null; store.set(null);
    closeDrawer(); closeModal();
    showLogin(message);
  }
  async function enter() {
    $('meName').textContent = state.staff.nombre;
    $('meRole').textContent = ROLE[state.staff.role] + ' · ' + state.staff.username;
    buildNav();
    $('loginView').classList.add('hidden');
    $('appView').classList.remove('hidden');
    route();
  }
  $('logoutBtn').onclick = () => logout();
  $('loginForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = $('loginBtn');
    btn.disabled = true; btn.innerHTML = '<span class="spin" style="border-top-color:#fff"></span>';
    $('loginError').classList.add('hidden');
    try {
      const r = await api('POST', '/auth/admin/login', { username: $('lgUser').value.trim(), password: $('lgPass').value });
      state.token = r.accessToken; state.staff = r.staff; store.set(r.accessToken);
      $('lgPass').value = '';
      enter();
    } catch (err) {
      $('loginError').textContent = err.message; $('loginError').classList.remove('hidden');
    } finally { btn.disabled = false; btn.textContent = 'Ingresar'; }
  };

  (async function init() {
    const saved = store.get();
    if (!saved) return showLogin();
    state.token = saved;
    try { state.staff = await api('GET', '/auth/admin/me'); enter(); }
    catch { logout(); }
  })();
})();
</script>
</body>
</html>
