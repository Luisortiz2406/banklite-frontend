server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  # Encabezados de seguridad comunes a la app y al panel. Railway sirve todo por HTTPS.
  # CSP: solo scripts/estilos propios (inline) y Google Fonts; la API solo por el gateway.
  set $csp "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api-gateway-production-dd7f.up.railway.app http://localhost:8080; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";

  # Panel administrativo de empleados.
  location = /admin { return 301 /admin/; }
  location /admin/ {
    try_files /admin.html =404;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $csp always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $csp always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  }
}
