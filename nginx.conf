server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;
  # Redirecciones relativas (/admin -> /admin/): conservan el esquema y el puerto del navegador.
  absolute_redirect off;

  # Encabezados de seguridad comunes a la app y al panel. Railway sirve todo por HTTPS.
  # CSP: solo scripts propios (sin inline: un XSS inyectado no se ejecuta), estilos propios/inline
  # y Google Fonts; la API solo por el gateway.
  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api-gateway-production-dd7f.up.railway.app http://localhost:8080; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";

  # robots.txt: proyecto académico, no debe quedar indexado ni rastreado por buscadores
  # (ese rastreo fue lo que disparó la alerta de "ingeniería social" de Google Safe Browsing).
  location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  # Panel administrativo de empleados (frontend/admin/): /admin/ es el tablero,
  # /admin/clientes sirve clientes.html y admin.js/admin.css salen tal cual.
  location = /admin { return 301 /admin/; }
  location /admin/ {
    try_files $uri $uri.html /admin/index.html;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $csp always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
  }

  # Páginas del frontend: /login y /login.html sirven lo mismo; lo desconocido va al inicio.
  # no-cache también para JS y CSS: tras un despliegue nadie queda con versiones viejas.
  location / {
    try_files $uri $uri.html /index.html;
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $csp always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # camera=(self): la página QR escanea códigos con la cámara del propio sitio.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
  }
}
