# Código de evaluación: scripts/entrypoint.sh genera /etc/nginx/banklite-codigo.conf al
# arrancar, a partir de la variable de entorno EVAL_CODE (Railway). Define dos variables:
#   $banklite_eval_ok    1 si la cookie banklite_eval trae el código correcto
#   $banklite_codigo_ok  1 si el encabezado X-Codigo-Evaluacion (POST /acceso/entrar) lo trae
# El código no está en el repositorio, ni en la imagen, ni en el JavaScript.
include /etc/nginx/banklite-codigo.conf;

# Rutas públicas sin código: la página de acceso y sus recursos, su endpoint, robots.txt
# (también health check de Railway) y la verificación de Google Search Console.
map $uri $banklite_publica {
  default 0;
  ~^/(acceso\.html|acceso\.css|acceso\.js|theme-init\.js|acceso/entrar|robots\.txt|googlec275dac7ffdbde9a\.html)$ 1;
}

# Cookie que deja POST /acceso/entrar: solo con método POST y código correcto (vacía en
# cualquier otro caso, y add_header no manda encabezados vacíos).
# HttpOnly: el JavaScript no puede leerla. Lax (no Strict): se envía al volver de Wompi.
map "$request_method:$banklite_codigo_ok" $banklite_set_cookie {
  default "";
  "POST:1" "banklite_eval=$http_x_codigo_evaluacion; Path=/; Max-Age=604800; HttpOnly; Secure; SameSite=Lax";
}

server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;
  # Redirecciones relativas (/admin -> /admin/): conservan el esquema y el puerto del navegador.
  absolute_redirect off;

  # Encabezados de seguridad comunes a la app y al panel (en nginx-seguridad.conf, copiado a
  # /etc/nginx/banklite-seguridad.conf). Railway sirve todo por HTTPS.
  # CSP: solo scripts propios (sin inline: un XSS inyectado no se ejecuta), estilos propios/inline
  # y Google Fonts; la API solo por el gateway. Excepción: el widget de pagos de Wompi
  # (recargas de saldo) se carga de checkout.wompi.co, abre su iframe desde ese dominio e
  # inyecta los scripts antifraude de Sift y ClearSale.
  set $csp "default-src 'self'; script-src 'self' https://checkout.wompi.co https://cdn.siftscience.com https://device.clearsale.com.br; frame-src https://checkout.wompi.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api-gateway-production-dd7f.up.railway.app http://localhost:8080; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";

  # Acceso de evaluación, cerrado por defecto: lo que no sea una ruta pública pide la cookie
  # con el código correcto, incluido /admin/ y cualquier location que se agregue después.
  # Sin ella se redirige a la página de acceso.
  set $banklite_bloqueo "$banklite_publica$banklite_eval_ok";
  if ($banklite_bloqueo = "00") {
    return 302 /acceso.html;
  }
  # Solo llega a esa redirección: cada location define sus propios encabezados.
  add_header Cache-Control "no-store" always;

  # robots.txt: proyecto académico, no debe quedar indexado ni rastreado por buscadores
  # (ese rastreo fue lo que disparó la alerta de "ingeniería social" de Google Safe Browsing).
  # Público: también es el health check de Railway.
  location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  # Verificación de Google Search Console: Google la consulta sin código.
  location = /googlec275dac7ffdbde9a.html {
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
  }

  # Página de acceso y sus recursos (públicos).
  location ~ ^/(acceso\.html|acceso\.css|acceso\.js|theme-init\.js)$ {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/banklite-seguridad.conf;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  }

  # Comprueba el código que manda acceso.js en el encabezado X-Codigo-Evaluacion:
  # 204 + cookie si es correcto, 401 si no. Solo POST.
  location = /acceso/entrar {
    add_header Cache-Control "no-store" always;
    include /etc/nginx/banklite-seguridad.conf;
    add_header Referrer-Policy "no-referrer" always;
    add_header Set-Cookie $banklite_set_cookie always;
    if ($request_method != POST) {
      return 405;
    }
    if ($banklite_codigo_ok = 0) {
      return 401;
    }
    return 204;
  }

  # Panel administrativo de empleados (frontend/admin/): /admin/ es el tablero,
  # /admin/clientes sirve clientes.html y admin.js/admin.css salen tal cual.
  location = /admin { return 301 /admin/; }
  location /admin/ {
    try_files $uri $uri.html /admin/index.html;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/banklite-seguridad.conf;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  }

  # Páginas del frontend: /login y /login.html sirven lo mismo; lo desconocido va al inicio.
  # no-cache también para JS y CSS: tras un despliegue nadie queda con versiones viejas.
  # private: dependen de la cookie de acceso, ningún caché compartido debe guardarlas.
  location / {
    try_files $uri $uri.html /index.html;
    add_header Cache-Control "private, no-cache" always;
    include /etc/nginx/banklite-seguridad.conf;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # camera=(self): la página QR escanea códigos con la cámara del propio sitio.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
  }
}
